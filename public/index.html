<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4f0" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅行手帳">
<title>旅行手帳</title>
<script>
  // 盡早套用深淺色，避免閃爍
  try { var t = localStorage.getItem("trip.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-64.png" type="image/png" sizes="64x64">
<link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header class="brand" id="brand"></header>
  <nav class="toprows" id="tabs" aria-label="分頁"></nav>
  <main id="main"><p class="loading">載入中…</p></main>
</div>


<div id="toast" class="toast" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<div id="lightbox" class="lightbox" hidden></div>
<input type="file" id="quickPhoto" accept="image/*" multiple hidden>

<script src="/app.js"></script>
</body>
</html>
