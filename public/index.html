<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f6f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅行手帳">
<title>旅行手帳</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <nav class="tabs" id="tabs"></nav>
  <main id="main"><p class="loading">載入中…</p></main>
</div>

<footer class="bar" id="bar">
  <span class="sync"><i id="syncDot"></i><span id="syncText">連接中…</span></span>
  <span class="bar-actions">
    <button class="btn ghost" id="photoModeBtn">▦ 縮圖</button>
    <button class="btn ghost" id="undoBtn" disabled>↶ 復原</button>
    <button class="btn ghost" id="menuBtn" aria-label="更多">⋯</button>
  </span>
</footer>

<div id="toast" class="toast" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<div id="lightbox" class="lightbox" hidden></div>
<input type="file" id="quickPhoto" accept="image/*" multiple hidden>

<script src="/app.js"></script>
</body>
</html>
